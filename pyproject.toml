[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cv-dataset-toolkit"
version = "0.1.0"
description = "Scans an image dataset folder, extracts and validates metadata, and exports a clean manifest."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Surya Senthil Kumar" }]
dependencies = [
    "Pillow>=10.4",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "pre-commit>=3.7",
]

[project.scripts]
cv-dataset-toolkit = "cv_dataset_toolkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["cv_dataset_toolkit"]
